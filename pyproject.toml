[project]
name = "scLineagePred"
version = "0.1.0"
description = "Source-only packaging for trajectory reconstruction, embedding training, classification, regression, and perturbation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hongye Wang" }
]
dependencies = [
  "anndata>=0.9",
  "geomloss>=0.2.6",
  "h5py>=3.8",
  "joblib>=1.2",
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=1.5",
  "POT>=0.9",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "seaborn>=0.12",
  "torch>=2.0",
  "torch-geometric>=2.3",
  "torchdiffeq>=0.2",
  "tqdm>=4.64",
]

[project.scripts]
sclineagepred = "scLineagePred.cli:main"
